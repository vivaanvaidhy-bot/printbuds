<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D Designs</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <header><h1>Step 2: Add 3D designs</h1><a class="toplink" href="./dashboard.html">Back to dashboard</a></header>
  <main class="wrap">
    <div class="card">
      <label>Design name<input id="designName" placeholder="Rainbow dragon"></label>
      <label>Take design photo<input id="designPhotoCamera" type="file" accept="image/*" capture="environment"></label>
      <label>Or choose from gallery<input id="designPhotoGallery" type="file" accept="image/*"></label>
      <p class="hint">You can use camera or gallery on mobile/iPad.</p>
      <button id="saveDesign">Save design</button>
    </div>
    <div class="card"><h2>Saved 3D designs</h2><div id="designGrid" class="entity-grid"></div></div>
  </main>
  <script src="supabase-config.js"></script>
  <script src="assets/js/models/defaults.js"></script>
  <script src="assets/js/models/mappers.js"></script>
  <script src="assets/js/lib/images.js"></script>
  <script src="assets/js/lib/storage.js"></script>
  <script src="assets/js/api/client.js"></script>
  <script src="assets/js/api/index.js"></script>
  <script src="assets/js/app/admin-common.js"></script>
  <script>
    MiniMakerAdmin.requireAccess();
    const { $, readState, loadSharedData, createDesign, updateDesign, deleteDesign, esc } = MiniMakerAdmin;
    let photo = '';
    async function loadPhoto(file){ if(!file) return; photo = await MiniMakerImages.fileToDataUrl(file, { maxWidth: 640, maxHeight: 640, quality: 0.68 }); }
    $('designPhotoCamera').onchange = e => loadPhoto(e.target.files?.[0]);
    $('designPhotoGallery').onchange = e => loadPhoto(e.target.files?.[0]);
    async function render(){
      await loadSharedData();
      const state = readState();
      $('designGrid').innerHTML = state.designLibrary.length
        ? state.designLibrary.map(c => `<div class="entity-card"><img class="photo" src="${c.photo}" alt="${esc(c.name)}"><h3>${esc(c.name)}</h3><div class="entity-actions"><button class="inline secondary" data-edit="${c.id}">Edit</button><button class="inline danger" data-delete="${c.id}">Delete</button></div></div>`).join('')
        : '<p>No designs yet.</p>';
      document.querySelectorAll('[data-edit]').forEach(button => button.onclick = async () => {
        const design = state.designLibrary.find(item => item.id === button.dataset.edit);
        if (!design) return;
        const name = prompt('Update design name:', design.name);
        if (!name) return;
        const useCurrentPhoto = confirm('Keep current photo? Tap Cancel if you want to use the last selected new photo.');
        await updateDesign(design.id, { name: name.trim(), photo: useCurrentPhoto ? design.photo : (photo || design.photo) });
        photo = '';
        render();
      });
      document.querySelectorAll('[data-delete]').forEach(button => button.onclick = async () => {
        const design = state.designLibrary.find(item => item.id === button.dataset.delete);
        if (!design) return;
        if (!confirm(`Delete ${design.name}?`)) return;
        await deleteDesign(design.id);
        render();
      });
    }
    $('saveDesign').onclick = async () => {
      const name = $('designName').value.trim();
      if (!name || !photo) return alert('Add design name and photo first.');
      await createDesign({ name, photo });
      $('designName').value = '';
      $('designPhotoCamera').value = '';
      $('designPhotoGallery').value = '';
      photo = '';
      render();
    };
    render();
  </script>
</body>
</html>
