<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Printed Toys</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf9ff;margin:0}header{padding:20px;background:linear-gradient(135deg,#5b39d5,#814ee7);color:#fff}.wrap{max-width:960px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e4e3ee;border-radius:18px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#eee}.chip{display:inline-flex;align-items:center;background:#dff8ee;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;margin:4px}.toplink{display:inline-block;color:#fff;background:rgba(255,255,255,.16);padding:10px 14px;border-radius:999px;text-decoration:none;margin-top:10px}label{display:block;margin-top:10px;font-weight:700}input{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin-top:5px}button{margin-top:12px;padding:12px 15px;border:0;border-radius:12px;background:#5b39d5;color:#fff;font-weight:800}.pick-card{border:2px solid #e4e3ee;border-radius:16px;padding:8px;background:#fff;cursor:pointer;text-align:left}.pick-card.active{border-color:#5b39d5;box-shadow:0 0 0 3px #f0edff}.pick-card strong{display:block;margin-top:8px}.hint{font-size:13px;color:#65657d}.selected{margin:8px 0 0;font-weight:700}.debug{background:#fff8d8;border:1px solid #f2d96b}.debug p{margin:6px 0;font-size:14px}</style></head><body><header><h1>Step 3: Add printed toys</h1><a class="toplink" href="./dashboard.html">Back to dashboard</a></header><main class="wrap"><div class="card debug"><h2>Debug box</h2><p><strong>Saved design count:</strong> <span id="debugDesignCount">0</span></p><p><strong>Saved color count:</strong> <span id="debugColorCount">0</span></p><p><strong>Design names:</strong> <span id="debugDesignNames">None</span></p><p><strong>Color names:</strong> <span id="debugColorNames">None</span></p></div><div class="card"><h2>Choose design</h2><div id="designGrid" class="grid"></div><p id="designPicked" class="selected">Pick a design first</p><h2>Choose color</h2><div id="colorGrid" class="grid"></div><p id="colorPicked" class="selected">Pick one or more colors</p><button id="addVariant" type="button">Add selected color</button><div id="variantList"></div><label>Ready now quantity<input id="qty" type="number" min="1" value="1"></label><label>Default selling price<input id="price" type="number" min="0.01" step="0.01" value="5.00"></label><button id="saveToy">Add printed toy to inventory</button><p id="status" class="hint"></p></div><div class="card"><h2>Current inventory</h2><div id="inventoryGrid"></div></div></main><script src="supabase-config.js"></script><script src="admin-common.js?v=2"></script><script>const Admin=MiniMakerAdmin;Admin.requireAccess();const {$,readState,colorChip,createInventoryItem,loadSharedData,esc,money}=Admin;let chosen=[];let selectedDesignId='';let selectedColorId='';function renderDebug(state){$('debugDesignCount').textContent=String(state.designLibrary.length);$('debugColorCount').textContent=String(state.colorLibrary.length);$('debugDesignNames').textContent=state.designLibrary.length?state.designLibrary.map(d=>d.name).join(', '):'None';$('debugColorNames').textContent=state.colorLibrary.length?state.colorLibrary.map(c=>c.name).join(', '):'None';}function renderPickers(){const state=readState();renderDebug(state);$('designGrid').innerHTML=state.designLibrary.length?state.designLibrary.map(d=>`<button type="button" class="pick-card ${selectedDesignId===d.id?'active':''}" data-design="${d.id}"><img class="photo" src="${d.photo}" alt="${esc(d.name)}"><strong>${esc(d.name)}</strong></button>`).join(''):'<p>Add a design first.</p>';$('colorGrid').innerHTML=state.colorLibrary.length?state.colorLibrary.map(c=>`<button type="button" class="pick-card ${selectedColorId===c.id?'active':''}" data-color="${c.id}"><img class="photo" src="${c.photo}" alt="${esc(c.name)}"><strong>${esc(c.name)}</strong></button>`).join(''):'<p>Add a color first.</p>';document.querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>{selectedDesignId=b.dataset.design;const design=state.designLibrary.find(d=>d.id===selectedDesignId);$('designPicked').textContent=design?`Picked design: ${design.name}`:'Pick a design first';renderPickers();});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{selectedColorId=b.dataset.color;const color=state.colorLibrary.find(c=>c.id===selectedColorId);$('colorPicked').textContent=color?`Picked color: ${color.name}`:'Pick one or more colors';renderPickers();});}function renderChosen(){ $('variantList').innerHTML=chosen.length?chosen.map(v=>colorChip(v)).join(' '):'<p>No colors added yet.</p>'; }async function renderInventory(){await loadSharedData();const state=readState();renderDebug(state);$('inventoryGrid').innerHTML=state.products.length?state.products.map(p=>`<div style="padding:12px 0;border-bottom:1px solid #e4e3ee"><strong>${esc(p.name)}</strong><br><img class="photo" style="max-width:120px" src="${p.photo||''}" alt="${esc(p.name)}"><p>${p.qty} ready now · ${money(p.price)}</p><p>${(p.variants||[]).map(colorChip).join(' ')}</p></div>`).join(''):'<p>No toys yet.</p>';renderPickers();}$('addVariant').onclick=()=>{const state=readState();const color=state.colorLibrary.find(c=>c.id===selectedColorId);if(!color)return alert('Pick a color first.');if(chosen.some(v=>v.color===color.name))return;chosen.push({color:color.name,photo:color.photo,price:Number($('price').value)||5});renderChosen();};$('price').onchange=()=>{chosen=chosen.map(v=>({...v,price:Number($('price').value)||5}));renderChosen();};$('saveToy').onclick=async()=>{const state=readState();const design=state.designLibrary.find(d=>d.id===selectedDesignId);if(!design)return alert('Pick a design first.');if(!chosen.length)return alert('Add at least one color.');const qty=Number($('qty').value);const price=Number($('price').value);const created=await createInventoryItem({name:design.name,qty,price,photo:design.photo,variants:chosen});$('status').textContent=`Added ${created.name} to inventory.`;chosen=[];selectedColorId='';renderChosen();await renderInventory();};renderChosen();renderInventory();</script></body></html>
