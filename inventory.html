<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Add Printed Toys</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <header>
    <h1>Step 3: Add printed toys</h1>
    <a class="toplink" href="./dashboard.html">Back to dashboard</a>
  </header>

  <main class="wrap">
    <div class="card debug">
      <h2>Debug box</h2>
      <p><strong>Saved design count:</strong> <span id="debugDesignCount">0</span></p>
      <p><strong>Saved color count:</strong> <span id="debugColorCount">0</span></p>
      <p><strong>Design names:</strong> <span id="debugDesignNames">None</span></p>
      <p><strong>Color names:</strong> <span id="debugColorNames">None</span></p>
    </div>

    <div class="card">
      <h2>Choose design</h2>
      <div id="designGrid" class="grid"></div>
      <p id="designPicked" class="selected">Pick a design first</p>

      <h2>Choose color</h2>
      <div id="colorGrid" class="grid"></div>
      <p id="colorPicked" class="selected">Pick one or more colors</p>

      <button id="addVariant" type="button">Add selected color</button>
      <div id="variantList"></div>

      <label>Ready now quantity<input id="qty" type="number" min="1" value="1"></label>
      <label>Default selling price<input id="price" type="number" min="0.01" step="0.01" value="5.00"></label>
      <button id="saveToy">Add printed toy to inventory</button>
      <p id="status" class="status"></p>
    </div>

    <div class="card">
      <h2>Current inventory</h2>
      <div id="inventoryGrid"></div>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script src="assets/js/models/defaults.js"></script>
  <script src="assets/js/models/mappers.js"></script>
  <script src="assets/js/lib/storage.js"></script>
  <script src="assets/js/api/client.js"></script>
  <script src="assets/js/api/index.js"></script>
  <script src="assets/js/app/admin-common.js"></script>
  <script>
    const Admin = MiniMakerAdmin;
    Admin.requireAccess();
    const { $, readState, colorChip, createInventoryItem, updateInventoryItem, deleteInventoryItem, loadSharedData, esc, money } = Admin;

    let chosen = [];
    let selectedDesignId = '';
    let selectedColorId = '';

    function renderDebug(state) {
      $('debugDesignCount').textContent = String(state.designLibrary.length);
      $('debugColorCount').textContent = String(state.colorLibrary.length);
      $('debugDesignNames').textContent = state.designLibrary.length ? state.designLibrary.map(d => d.name).join(', ') : 'None';
      $('debugColorNames').textContent = state.colorLibrary.length ? state.colorLibrary.map(c => c.name).join(', ') : 'None';
    }

    function renderPickers() {
      const state = readState();
      renderDebug(state);
      $('designGrid').innerHTML = state.designLibrary.length
        ? state.designLibrary.map(d => `<button type="button" class="pick-card ${selectedDesignId === d.id ? 'active' : ''}" data-design="${d.id}"><img class="photo" src="${d.photo}" alt="${esc(d.name)}"><strong>${esc(d.name)}</strong></button>`).join('')
        : '<p>Add a design first.</p>';
      $('colorGrid').innerHTML = state.colorLibrary.length
        ? state.colorLibrary.map(c => `<button type="button" class="pick-card ${selectedColorId === c.id ? 'active' : ''}" data-color="${c.id}"><img class="photo" src="${c.photo}" alt="${esc(c.name)}"><strong>${esc(c.name)}</strong></button>`).join('')
        : '<p>Add a color first.</p>';

      document.querySelectorAll('[data-design]').forEach(button => {
        button.onclick = () => {
          selectedDesignId = button.dataset.design;
          const design = state.designLibrary.find(d => d.id === selectedDesignId);
          $('designPicked').textContent = design ? `Picked design: ${design.name}` : 'Pick a design first';
          renderPickers();
        };
      });

      document.querySelectorAll('[data-color]').forEach(button => {
        button.onclick = () => {
          selectedColorId = button.dataset.color;
          const color = state.colorLibrary.find(c => c.id === selectedColorId);
          $('colorPicked').textContent = color ? `Picked color: ${color.name}` : 'Pick one or more colors';
          renderPickers();
        };
      });
    }

    function renderChosen() {
      $('variantList').innerHTML = chosen.length ? chosen.map(v => colorChip(v)).join(' ') : '<p>No colors added yet.</p>';
    }

    async function editInventory(id) {
      const state = readState();
      const item = state.products.find(p => p.id === id);
      if (!item) return;
      const qty = Number(prompt('Update ready now quantity:', String(item.qty)));
      if (Number.isNaN(qty) || qty < 0) return;
      const price = Number(prompt('Update selling price:', String(item.price)));
      if (Number.isNaN(price) || price < 0) return;
      await updateInventoryItem(id, { qty, price });
      $('status').textContent = `Updated ${item.name}.`;
      await renderInventory();
    }

    async function removeInventory(id) {
      const state = readState();
      const item = state.products.find(p => p.id === id);
      if (!item) return;
      if (!confirm(`Delete ${item.name} from inventory?`)) return;
      await deleteInventoryItem(id);
      $('status').textContent = `Deleted ${item.name}.`;
      await renderInventory();
    }

    async function renderInventory() {
      await loadSharedData();
      const state = readState();
      renderDebug(state);
      $('inventoryGrid').innerHTML = state.products.length
        ? state.products.map(p => `<div class="list-row"><strong>${esc(p.name)}</strong><br><img class="photo" src="${p.photo || ''}" alt="${esc(p.name)}"><p>${p.qty} ready now · ${money(p.price)}</p><p>${(p.variants || []).map(colorChip).join(' ')}</p><div class="entity-actions"><button class="inline secondary" data-edit-item="${p.id}">Edit</button><button class="inline danger" data-delete-item="${p.id}">Delete</button></div></div>`).join('')
        : '<p>No toys yet.</p>';

      document.querySelectorAll('[data-edit-item]').forEach(button => button.onclick = () => editInventory(button.dataset.editItem));
      document.querySelectorAll('[data-delete-item]').forEach(button => button.onclick = () => removeInventory(button.dataset.deleteItem));
      renderPickers();
    }

    $('addVariant').onclick = () => {
      const state = readState();
      const color = state.colorLibrary.find(c => c.id === selectedColorId);
      if (!color) return alert('Pick a color first.');
      if (chosen.some(v => v.color === color.name)) return;
      chosen.push({ color: color.name, photo: color.photo, price: Number($('price').value) || 5 });
      renderChosen();
    };

    $('price').onchange = () => {
      chosen = chosen.map(v => ({ ...v, price: Number($('price').value) || 5 }));
      renderChosen();
    };

    $('saveToy').onclick = async () => {
      const state = readState();
      const design = state.designLibrary.find(d => d.id === selectedDesignId);
      if (!design) return alert('Pick a design first.');
      if (!chosen.length) return alert('Add at least one color.');
      const qty = Number($('qty').value);
      const price = Number($('price').value);
      const created = await createInventoryItem({ name: design.name, qty, price, photo: design.photo, variants: chosen });
      $('status').textContent = `Added ${created.name} to inventory.`;
      chosen = [];
      selectedColorId = '';
      renderChosen();
      await renderInventory();
    };

    renderChosen();
    renderInventory();
  </script>
</body>
</html>
