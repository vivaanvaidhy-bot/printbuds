<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders and Sales</title><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/admin.css"></head><body><header><h1>Step 4: Orders and sales</h1><a class="toplink" href="./dashboard.html">Back to dashboard</a></header><main class="wrap"><div class="card"><h2>Customer orders</h2><div id="ordersList"></div></div><div class="card"><h2>Sales, free, and broken records</h2><div id="recordsList"></div></div></main><script src="supabase-config.js"></script><script src="assets/js/models/defaults.js"></script><script src="assets/js/models/mappers.js"></script><script src="assets/js/lib/storage.js"></script><script src="assets/js/api/client.js"></script><script src="assets/js/api/index.js"></script><script src="assets/js/app/admin-common.js"></script><script>const A=MiniMakerAdmin;A.requireAccess();const {readState,loadSharedData,updateOrder,updateInventoryItem,createRecord,updateRecord,deleteRecord,today,esc,money}=A;function label(status){return ({pending_print:'Pending print',ready_for_pickup:'Ready for pickup',completed:'Completed'})[status]||status;}async function complete(order){const state=readState();const product=state.products.find(p=>p.id===order.productId);if(!product||order.qty>product.qty)return alert('Not enough ready stock to complete this order.');await updateInventoryItem(product.id,{qty:product.qty-order.qty});await createRecord({productId:product.id,name:product.name,qty:order.qty,price:product.price,color:order.color,buyer:order.customer,recordType:'sale',date:today()});await updateOrder(order.id,'completed');await render();}async function editRecord(id){const state=readState();const record=state.records.find(r=>r.id===id);if(!record)return;const qty=Number(prompt('Update quantity:',String(record.qty)));if(Number.isNaN(qty)||qty<=0)return;const buyer=prompt('Update buyer/customer name:',record.buyer||'') ?? record.buyer;await updateRecord(id,{qty,buyer,color:record.color,price:record.price,record_type:record.recordType,occurred_on:record.date});await render();}async function removeRecord(id){const state=readState();const record=state.records.find(r=>r.id===id);if(!record)return;if(!confirm(`Delete ${record.name} record?`))return;await deleteRecord(id);await render();}async function render(){await loadSharedData();const state=readState();document.getElementById('ordersList').innerHTML=state.orders.length?state.orders.map(order=>`<div class="activity"><strong>${esc(order.color)} ${esc(order.name)} x ${order.qty}</strong><br>${esc(order.customer)} · ${esc(order.contact)}<br><span>${esc(label(order.status))}</span>${order.status==='pending_print'?`<button class="inline" data-ready="${order.id}">Mark ready</button>`:''}${order.status==='ready_for_pickup'?`<button class="inline" data-complete="${order.id}">Complete sale</button>`:''}</div>`).join(''):'<p>No orders yet.</p>';document.getElementById('recordsList').innerHTML=state.records.length?state.records.map(record=>`<div class="activity"><strong>${esc(record.name)} x ${record.qty}</strong> <span class="badge">${esc(record.recordType)}</span><br>${esc(record.color)} · ${money(record.price)} · ${esc(record.buyer||'No buyer name')}<br><span class="small">${esc(record.date)}</span><div class="entity-actions"><button class="inline secondary" data-edit-record="${record.id}">Edit</button><button class="inline danger" data-delete-record="${record.id}">Delete</button></div></div>`).join(''):'<p>No sale records yet.</p>';document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=async()=>{await updateOrder(b.dataset.ready,'ready_for_pickup');render();});document.querySelectorAll('[data-complete]').forEach(b=>{const order=state.orders.find(o=>o.id===b.dataset.complete);b.onclick=()=>complete(order);});document.querySelectorAll('[data-edit-record]').forEach(b=>b.onclick=()=>editRecord(b.dataset.editRecord));document.querySelectorAll('[data-delete-record]').forEach(b=>b.onclick=()=>removeRecord(b.dataset.deleteRecord));}render();</script></body></html>
