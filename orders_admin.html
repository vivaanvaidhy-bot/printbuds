<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders and Sales</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf9ff;margin:0}header{padding:20px;background:linear-gradient(135deg,#5b39d5,#814ee7);color:#fff}.wrap{max-width:960px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e4e3ee;border-radius:18px;padding:16px;margin-bottom:14px}.activity{padding:12px 0;border-bottom:1px solid #e4e3ee}.activity:last-child{border-bottom:0}button{margin-left:8px;padding:8px 10px;border:0;border-radius:10px;background:#5b39d5;color:#fff;font-weight:800}.toplink{display:inline-block;color:#fff;background:rgba(255,255,255,.16);padding:10px 14px;border-radius:999px;text-decoration:none;margin-top:10px}</style></head><body><header><h1>Step 4: Orders and sales</h1><a class="toplink" href="./dashboard.html">Back to dashboard</a></header><main class="wrap"><div class="card"><h2>Customer orders</h2><div id="ordersList"></div></div></main><script src="supabase-config.js"></script><script src="admin-common.js?v=2"></script><script>const A=MiniMakerAdmin;A.requireAccess();const {readState,loadSharedData,updateOrder,updateInventoryItem,createRecord,today,esc,money}=A;function label(status){return ({pending_print:'Pending print',ready_for_pickup:'Ready for pickup',completed:'Completed'})[status]||status;}async function complete(order){const state=readState();const product=state.products.find(p=>p.id===order.productId);if(!product||order.qty>product.qty)return alert('Not enough ready stock to complete this order.'); await updateInventoryItem(product.id,{qty:product.qty-order.qty}); await createRecord({product_id:product.id,product_name:product.name,qty:order.qty,price:product.price,color:order.color,buyer:order.customer,record_type:'sale',occurred_on:today()}); await updateOrder(order.id,'completed'); await render();}async function render(){await loadSharedData();const state=readState();document.getElementById('ordersList').innerHTML=state.orders.length?state.orders.map(order=>`<div class="activity"><strong>${esc(order.color)} ${esc(order.name)} x ${order.qty}</strong><br>${esc(order.customer)} · ${esc(order.contact)}<br><span>${esc(label(order.status))}</span>${order.status==='pending_print'?`<button data-ready="${order.id}">Mark ready</button>`:''}${order.status==='ready_for_pickup'?`<button data-complete="${order.id}">Complete sale</button>`:''}</div>`).join(''):'<p>No orders yet.</p>';document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=async()=>{await updateOrder(b.dataset.ready,'ready_for_pickup');render();});document.querySelectorAll('[data-complete]').forEach(b=>{const order=state.orders.find(o=>o.id===b.dataset.complete);b.onclick=()=>complete(order);});}render();</script></body></html>
