<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Maker Shop Camera</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}#tools{position:fixed;right:18px;bottom:18px;z-index:5;display:grid;gap:8px}button{border:0;border-radius:999px;background:#5b39d5;color:#fff;font:700 15px system-ui;padding:13px 16px;box-shadow:0 8px 22px #2227}.loss{background:#a33354}dialog{border:0;border-radius:18px;width:min(540px,94vw);padding:16px}video,canvas{width:100%;border-radius:12px;background:#181825}canvas{display:none}dialog button{border-radius:10px;margin:10px 5px 0 0}.hint{font:14px system-ui;color:#555}.total{background:#fff1f4;padding:12px;border-radius:12px;font:15px system-ui}</style></head><body><iframe id="shop" src="index.html" title="Mini Maker Shop"></iframe><div id="tools"><button id="camera">📷 Take toy photo</button><button class="loss" id="broken">💔 A toy broke</button></div><dialog id="cameraModal"><h2>Take a toy photo</h2><p class="hint">Point the laptop camera at the toy, then capture it.</p><video id="video" autoplay playsinline></video><canvas id="canvas"></canvas><div><button id="capture">Use this photo</button><button id="closeCamera">Cancel</button></div></dialog><dialog id="brokenModal"><h2>Record a broken toy</h2><p class="hint">This is not bad—it is an honest business record. We subtract it from the shelf and show what it cost to make.</p><select id="brokenToy"></select><input id="brokenQty" type="number" min="1" value="1" style="width:80px;padding:8px"><div><button class="loss" id="saveBroken">Record breakage</button><button id="closeBroken">Cancel</button></div></dialog><dialog id="lossModal"><h2>Broken-toy loss</h2><div id="lossTotal" class="total"></div><button id="closeLoss">I understand</button></dialog><script>
const $=id=>document.getElementById(id),key='mini-maker-shop-v1',shop=$('shop'),cameraModal=$('cameraModal'),brokenModal=$('brokenModal'),lossModal=$('lossModal'),video=$('video'),canvas=$('canvas');let stream;const read=()=>JSON.parse(localStorage.getItem(key)||'{"products":[],"losses":[]}'),write=x=>localStorage.setItem(key,JSON.stringify(x)),cash=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;cameraModal.close()}$('camera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream;cameraModal.showModal()}catch(e){alert('Please allow camera access. Open this page through localhost or an HTTPS web link, then try again.')}};$('closeCamera').onclick=stop;$('capture').onclick=()=>{canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.toBlob(blob=>{const file=new File([blob],'toy-photo.jpg',{type:'image/jpeg'}),input=shop.contentDocument.getElementById('photo'),files=new DataTransfer();files.items.add(file);input.files=files.files;input.dispatchEvent(new Event('change',{bubbles:true}));stop();alert('Photo added! Now enter the toy name and pricing details.');},'image/jpeg',.9)};function lossSummary(){const s=read(),losses=s.losses||[],value=losses.reduce((n,x)=>n+x.cost*x.qty,0),count=losses.reduce((n,x)=>n+x.qty,0);$('lossTotal').innerHTML=`<b>${count} toy(s) broke.</b><br>Money spent making them: <b>${cash(value)}</b><br><br>Lesson: write down breakage honestly, then think about how to improve the next print.`}function showBroken(){const s=read(),available=s.products.filter(p=>p.qty>0);if(!available.length)return alert('There are no toys on the shelf to mark as broken.');$('brokenToy').innerHTML=available.map(p=>`<option value="${p.id}">${p.name} — ${p.qty} ready</option>`).join('');brokenModal.showModal()}$('broken').onclick=showBroken;$('closeBroken').onclick=()=>brokenModal.close();$('saveBroken').onclick=async()=>{const s=read(),p=s.products.find(x=>x.id===$('brokenToy').value),qty=+$('brokenQty').value;if(!p||qty<1||qty>p.qty)return alert('Choose a quantity that is on the shelf.');const button=$('saveBroken');button.disabled=true;try{const response=await fetch('/api/inventory',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:p.id,qty:p.qty-qty})}),body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'Inventory could not be updated.');p.qty=body.qty;(s.losses??=[]).push({name:p.name,qty,cost:p.material+p.labor});write(s);brokenModal.close();shop.src='index.html';lossSummary();lossModal.showModal()}catch(error){alert(error.message)}finally{button.disabled=false}};$('closeLoss').onclick=()=>lossModal.close();
</script></body></html>
