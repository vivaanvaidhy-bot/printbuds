<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Filament Colors</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <header><h1>Step 1: Add filament colors</h1><a class="toplink" href="./dashboard.html">Back to dashboard</a></header>
  <main class="wrap">
    <div class="card">
      <label>Color name<input id="colorName" placeholder="Blue"></label>
      <label>Take filament photo<input id="colorPhotoCamera" type="file" accept="image/*" capture="environment"></label>
      <label>Or choose from gallery<input id="colorPhotoGallery" type="file" accept="image/*"></label>
      <p class="hint">You can use camera or gallery on mobile/iPad.</p>
      <button id="saveColor">Save color</button>
    </div>
    <div class="card"><h2>Saved filament colors</h2><div id="colorGrid" class="entity-grid"></div></div>
  </main>
  <script src="supabase-config.js"></script>
  <script src="assets/js/models/defaults.js"></script>
  <script src="assets/js/models/mappers.js"></script>
  <script src="assets/js/lib/storage.js"></script>
  <script src="assets/js/api/client.js"></script>
  <script src="assets/js/api/index.js"></script>
  <script src="assets/js/app/admin-common.js"></script>
  <script>
    MiniMakerAdmin.requireAccess();
    const { $, readState, loadSharedData, createColor, updateColor, deleteColor, esc } = MiniMakerAdmin;
    let photo = '';
    function loadPhoto(file){ if(!file) return; const r = new FileReader(); r.onload = () => photo = r.result; r.readAsDataURL(file); }
    $('colorPhotoCamera').onchange = e => loadPhoto(e.target.files?.[0]);
    $('colorPhotoGallery').onchange = e => loadPhoto(e.target.files?.[0]);
    async function render(){
      await loadSharedData();
      const state = readState();
      $('colorGrid').innerHTML = state.colorLibrary.length
        ? state.colorLibrary.map(c => `<div class="entity-card"><img class="photo" src="${c.photo}" alt="${esc(c.name)}"><h3>${esc(c.name)}</h3><div class="entity-actions"><button class="inline secondary" data-edit="${c.id}">Edit</button><button class="inline danger" data-delete="${c.id}">Delete</button></div></div>`).join('')
        : '<p>No colors yet.</p>';
      document.querySelectorAll('[data-edit]').forEach(button => button.onclick = async () => {
        const color = state.colorLibrary.find(item => item.id === button.dataset.edit);
        if (!color) return;
        const name = prompt('Update color name:', color.name);
        if (!name) return;
        const useCurrentPhoto = confirm('Keep current photo? Tap Cancel if you want to use the last selected new photo.');
        await updateColor(color.id, { name: name.trim(), photo: useCurrentPhoto ? color.photo : (photo || color.photo) });
        photo = '';
        render();
      });
      document.querySelectorAll('[data-delete]').forEach(button => button.onclick = async () => {
        const color = state.colorLibrary.find(item => item.id === button.dataset.delete);
        if (!color) return;
        if (!confirm(`Delete ${color.name}?`)) return;
        await deleteColor(color.id);
        render();
      });
    }
    $('saveColor').onclick = async () => {
      const name = $('colorName').value.trim();
      if (!name || !photo) return alert('Add color name and photo first.');
      await createColor({ name, photo });
      $('colorName').value = '';
      $('colorPhotoCamera').value = '';
      $('colorPhotoGallery').value = '';
      photo = '';
      render();
    };
    render();
  </script>
</body>
</html>
