<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf9ff;margin:0}header{padding:20px;background:linear-gradient(135deg,#5b39d5,#814ee7);color:#fff}.wrap{max-width:960px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;border:1px solid #e4e3ee;border-radius:18px;padding:16px;margin-bottom:14px}.stat{background:#f0edff;border-radius:14px;padding:12px}.stat strong{display:block;font-size:24px}.toplink{display:inline-block;color:#fff;background:rgba(255,255,255,.16);padding:10px 14px;border-radius:999px;text-decoration:none;margin-top:10px}</style></head><body><header><h1>Step 5: Reports</h1><a class="toplink" href="./dashboard.html">Back to dashboard</a></header><main class="wrap"><div class="grid"><div class="stat"><span>Toys sold</span><strong id="sold">0</strong></div><div class="stat"><span>Given free</span><strong id="free">0</strong></div><div class="stat"><span>Broken</span><strong id="broken">0</strong></div><div class="stat"><span>Pending print</span><strong id="pending">0</strong></div><div class="stat"><span>Completed orders</span><strong id="completed">0</strong></div></div></main><script src="supabase-config.js"></script><script src="admin-common.js?v=2"></script><script>const A=MiniMakerAdmin;A.requireAccess();const {readState,loadSharedData}=A;function total(records,type){return records.filter(r=>r.recordType===type).reduce((s,r)=>s+r.qty,0)}async function render(){await loadSharedData();const s=readState();document.getElementById('sold').textContent=total(s.records,'sale');document.getElementById('free').textContent=total(s.records,'free');document.getElementById('broken').textContent=total(s.records,'broken');document.getElementById('pending').textContent=s.orders.filter(o=>o.status==='pending_print').length;document.getElementById('completed').textContent=s.orders.filter(o=>o.status==='completed'||o.status==='fulfilled').length;}render();</script></body></html>
